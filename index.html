<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Student Productivity Analyzer</title>

  <style>
    body { font-family: Arial; margin: 24px; max-width: 700px; }
    input, button { padding: 8px; margin: 4px; }

    #list, #result, #imageStatus {
      border: 1px solid #ddd;
      padding: 10px;
      margin-top: 10px;
      white-space: pre-line;
    }

    img {
      max-width: 300px;
      margin-top: 12px;
      display: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h2>Student Productivity Analyzer</h2>

<input id="act" placeholder="contoh: belajar, game">
<input id="min" type="number" placeholder="menit">

<button id="addBtn">Tambah</button>
<button id="analysisBtn">Analisis AI</button>
<button id="generateBtn">Generate Gambar</button>

<p id="total">Total: 0 menit</p>

<h3>Aktivitas:</h3>
<div id="list">Belum ada data</div>

<h3>Analisis AI:</h3>
<div id="result">Belum dianalisis</div>

<h3>Gambar AI:</h3>
<div id="imageStatus">Belum ada gambar</div>
<img id="aiImage">

<script src="storage.js"></script>
<script src="dom.js"></script>
<script src="app.js"></script>

</body>
</html>
